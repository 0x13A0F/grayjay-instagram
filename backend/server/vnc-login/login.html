<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in to Instagram</title>
<style>
  :root { color-scheme: dark; --bg: #0e0e10; --fg: #f2f2f2;
          --muted: #a0a0a5; --accent: #d6249f; --line: #26262b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    background: var(--bg); color: var(--fg);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
  }
  header {
    flex: 0 0 auto; padding: 10px 12px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto;
    background: var(--accent); animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .25; } }
  #status { flex: 1 1 auto; min-width: 0; color: var(--muted); font-size: 13px; }
  #done {
    flex: 0 0 auto; border: 1px solid var(--line); background: transparent;
    color: var(--fg); font: inherit; font-size: 12px; padding: 6px 10px;
    border-radius: 6px;
  }
  /* The noVNC client fills everything below the bar. */
  iframe { flex: 1 1 auto; width: 100%; border: 0; display: block; }
</style>
</head>
<body>
  <header>
    <span class="dot" aria-hidden="true"></span>
    <span id="status">Log in to Instagram below. This closes by itself once
      the backend picks up the session.</span>
    <button id="done" type="button">Skip</button>
  </header>
  <iframe id="vnc" title="Instagram login (remote browser)"
          src="vnc.html?autoconnect=true&amp;resize=scale&amp;reconnect=true"></iframe>

<script>
// This page is opened by Grayjay's built-in login webview (authentication.
// loginUrl). It shows the backend's real Camoufox browser over noVNC, so the
// whole first-time login happens on the phone. When the backend reports a live
// Instagram session we navigate to the plugin's completionUrl, which is what
// makes Grayjay fire onLogin, close this view and mark the source logged in
// (that in turn unlocks Import Subscriptions).
(function () {
    var params = new URLSearchParams(location.search);
    // Backend API origin, baked in by configure.py (it can be a different
    // host/port than this noVNC page, hence the explicit parameter).
    var api = (params.get("api") || "").replace(/\/+$/, "");
    var statusEl = document.getElementById("status");
    var finished = false;

    function finish() {
        if (finished) return;
        finished = true;
        // Relative, so it always resolves to the same origin Grayjay loaded -
        // the completionUrl is configured with a trailing "?*", so any query
        // string is fine as long as the path matches exactly.
        location.replace("login-done.html?ok=1");
    }
    document.getElementById("done").addEventListener("click", finish);

    if (!api) {
        statusEl.textContent = "Log in to Instagram below, then tap Skip.";
        return;
    }

    function poll() {
        if (finished) return;
        fetch(api + "/health", { cache: "no-store" })
            .then(function (r) { return r.json(); })
            .then(function (h) {
                if (h && h.ready && !h.needs_login) finish();
            })
            .catch(function () {
                // Cross-origin/offline backend: the manual button still works.
                statusEl.textContent = "Log in to Instagram below, then tap "
                    + "Skip (couldn't reach the backend to auto-detect it).";
            });
    }
    poll();
    setInterval(poll, 2000);
})();
</script>
</body>
</html>
