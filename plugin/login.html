<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram (Grayjay plugin)</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666666;
    --accent: #d6249f; /* Instagram-ish accent */
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e0e10; --fg: #f2f2f2; --muted: #a0a0a5; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    background: var(--bg);
    color: var(--fg);
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card { max-width: 360px; }
  h1 { font-size: 1.1rem; margin: 0 0 8px; color: var(--accent); }
  p { color: var(--muted); font-size: 0.9rem; line-height: 1.5; margin: 0; }
</style>
</head>
<body>
  <div class="card">
    <h1>You're all set</h1>
    <p>This plugin signs in to Instagram through its own self-hosted backend
      (the noVNC login), not through this screen — there's nothing to enter
      here. This page only unlocks Grayjay's import buttons. It should close
      on its own in a moment.</p>
  </div>
</body>
</html>
