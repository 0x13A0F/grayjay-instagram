<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Install: Instagram (Grayjay plugin)</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666666;
    --card: #f5f5f7;
    --border: #e0e0e2;
    --accent: #d6249f; /* Instagram-ish accent */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e10;
      --fg: #f2f2f2;
      --muted: #a0a0a5;
      --card: #1a1a1d;
      --border: #2c2c30;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .header img {
    width: 32px;
    height: 32px;
    border-radius: 8px;
  }
  h1 {
    font-size: 1.25rem;
    margin: 0;
    font-weight: 600;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 0.95rem;
  }
  .warning {
    background: #fff3cd;
    color: #664d03;
    border: 1px solid #ffe69c;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.85rem;
    margin-bottom: 20px;
    text-align: left;
  }
  @media (prefers-color-scheme: dark) {
    .warning { background: #3a2f0e; color: #ffe69c; border-color: #5c4a12; }
  }
  .qr-box {
    background: #ffffff;
    border-radius: 16px;
    padding: 20px;
    display: inline-block;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
  }
  .qr-box img {
    display: block;
    width: 220px;
    height: 220px;
  }
  .steps {
    text-align: left;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-top: 24px;
    font-size: 0.9rem;
    line-height: 1.5;
  }
  .steps ol { margin: 0; padding-left: 1.1em; }
  .url-row {
    display: flex;
    gap: 8px;
    margin-top: 20px;
  }
  .url-row input {
    flex: 1;
    min-width: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.8rem;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--fg);
  }
  button#copyBtn {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  button#copyBtn:active { opacity: 0.8; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <img src="icon.png" alt="" onerror="this.style.display='none'">
      <h1>Instagram</h1>
    </div>
    <p class="sub">Grayjay plugin — scan to install</p>

    {{WARNING_HTML}}

    <div class="qr-box">
      <img src="qr.svg" alt="QR code for the plugin source URL">
    </div>

    <div class="steps">
      <ol>
        <li>Open <strong>Grayjay</strong> → Settings → <strong>Plugins</strong></li>
        <li>Tap <strong>Add</strong> / the <strong>+</strong> button</li>
        <li><strong>Scan QR code</strong> and point your camera at the code above
          — or paste the URL below instead</li>
      </ol>
    </div>

    <div class="url-row">
      <input id="sourceUrl" type="text" readonly value="{{SOURCE_URL}}">
      <button id="copyBtn" type="button">Copy</button>
    </div>
  </div>

  <script>
    document.getElementById('copyBtn').addEventListener('click', function () {
      var input = document.getElementById('sourceUrl');
      var btn = document.getElementById('copyBtn');
      var done = function () {
        btn.textContent = 'Copied';
        setTimeout(function () { btn.textContent = 'Copy'; }, 1500);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(input.value).then(done);
      } else {
        input.removeAttribute('readonly');
        input.select();
        document.execCommand('copy');
        input.setAttribute('readonly', '');
        done();
      }
    });
  </script>
</body>
</html>
